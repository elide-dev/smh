name: Fuzzing
'on':
  pull_request:
    paths: ['src/main/java/**', 'tests/fuzz/**', 'tools/**', '.github/actions/**', 'elide.pkl', 'mise.toml', '.github/workflows/fuzz.yml']
  push:
    branches: [main]
  schedule:
    - cron: '31 5 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  parsers:
    name: ${{ matrix.target }} fuzzing / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        target: [callgrind, run-config]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate findings and fuzz production parser
        env:
          FUZZ_RUNS: ${{ github.event_name == 'schedule' && '1000000' || '10000' }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: python tools/fuzz_callgrind.py --target "$FUZZ_TARGET" --runs "$FUZZ_RUNS" --output "build/fuzz-$FUZZ_TARGET/ci"
      - name: Preserve corpus, crash inputs, reproducers, and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-fuzz-${{ matrix.os }}
          path: build/fuzz-${{ matrix.target }}/
          retention-days: 14
      - name: Upload campaign JUnit result
        if: ${{ !cancelled() && hashFiles(format('build/fuzz-{0}/ci/junit.xml', matrix.target)) != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          use_oidc: true
          plugins: noop
          files: build/fuzz-${{ matrix.target }}/ci/junit.xml
          disable_search: true
          flags: ${{ matrix.target }}-fuzz-${{ matrix.os }}
          fail_ci_if_error: true
