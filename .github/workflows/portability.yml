name: Portable JVM behavior
'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prepare digest-checked portable test bundle using Elide
        run: python tools/test_portable.py prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-jvm-bundle
          path: build/portable/
          retention-days: 7

  portable:
    name: Portable JVM API / ${{ matrix.os }}
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '25'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portable-jvm-bundle
          path: build/portable/
      - name: Exercise portable behavior on this native JVM worker
        run: python tools/test_portable.py run
      - name: Report portable test results
        if: ${{ !cancelled() && hashFiles('build/reports/portable/*.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          use_oidc: true
          plugins: noop
          directory: build/reports/portable
          flags: portable-${{ matrix.os }}
          fail_ci_if_error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: portable-results-${{ matrix.os }}
          path: build/reports/portable/
