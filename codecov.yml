codecov:
  require_ci_to_pass: true
coverage:
  precision: 2
  round: down
  range: 90..100
  status:
    project:
      default:
        target: 99%
        threshold: 0%
    patch:
      default:
        target: 100%
        threshold: 0%
comment:
  layout: reach,diff,flags,files
  require_changes: true
ignore:
  - src/test/**/*
  - tests/**/*
