[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["build", "target", ".dev"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["build", "verification"]
